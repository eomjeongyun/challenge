<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#FDEBA8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Challenge">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>Challenge</title>
</head>
<body>
  <main class="app-shell">
    <section id="home-screen" class="screen active">
      <header class="top-header">
        <h1>Challenge</h1>
      </header>

      <button id="ddayCard" type="button" class="dday-card">
        <p id="ddayLabel" class="dday-label"></p>
        <p id="ddayNumber" class="dday-number"></p>
      </button>

      <div class="card writing-card">
        <div class="section-head">
          <h2>✍️ 오늘의 글쓰기</h2>
          <button id="openPromptBank" class="link-button" type="button">글감 보관함</button>
        </div>
        <p id="writingStatus" class="writing-status"></p>
        <button id="writeTodayButton" class="primary-button wide" type="button">오늘 글쓰기</button>
      </div>

      <div id="avoidCards" class="avoid-cards"></div>
    </section>

    <section id="calendar-screen" class="screen" hidden>
      <header class="top-header">
        <h1>달력</h1>
      </header>
      <div class="month-nav">
        <button id="prevMonth" class="icon-button" type="button" aria-label="이전 달">‹</button>
        <span id="calendarTitle" class="month-title"></span>
        <button id="nextMonth" class="icon-button" type="button" aria-label="다음 달">›</button>
      </div>
      <div id="challengeAccordion" class="accordion"></div>
    </section>
  </main>

  <nav class="tab-bar" aria-label="주요 메뉴">
    <button class="tab active" data-screen="home" type="button"><span class="tab-icon home-icon" aria-hidden="true"></span><span>홈</span></button>
    <button class="tab" data-screen="calendar" type="button"><span class="tab-icon calendar-icon" aria-hidden="true"></span><span>달력</span></button>
  </nav>

  <div id="ddaySheet" class="sheet-backdrop" hidden>
    <div class="sheet">
      <p class="sheet-title">디데이 설정</p>
      <label class="field">목표 날짜
        <input id="ddayDateInput" type="date">
      </label>
      <label class="field">이름 (선택)
        <input id="ddayNameInput" type="text" placeholder="예: 2027년">
      </label>
      <div class="sheet-actions">
        <button id="cancelDday" class="secondary-button" type="button">취소</button>
        <button id="saveDday" class="primary-button" type="button">저장</button>
      </div>
    </div>
  </div>

  <div id="writingSheet" class="sheet-backdrop" hidden>
    <div class="sheet">
      <p id="writingSheetTitle" class="sheet-title">글쓰기</p>
      <button id="pickPromptInline" class="link-button" type="button">글감에서 주제 고르기</button>
      <label class="field">주제
        <input id="topicInput" type="text" placeholder="오늘 무엇에 대해 써볼까요?">
      </label>
      <label class="field">내용
        <textarea id="contentInput" rows="10" placeholder="자유롭게 적어보세요"></textarea>
      </label>
      <p id="charCount" class="char-count">0자</p>
      <div class="sheet-actions">
        <button id="deleteWriting" class="danger-button" type="button" hidden>삭제</button>
        <button id="cancelWriting" class="secondary-button" type="button">취소</button>
        <button id="saveWriting" class="primary-button" type="button">저장</button>
      </div>
    </div>
  </div>

  <div id="promptSheet" class="sheet-backdrop" hidden>
    <div class="sheet">
      <p class="sheet-title">글감 보관함</p>
      <div id="promptList" class="prompt-list"></div>
      <form id="addPromptForm" class="quick-bar">
        <input id="newPromptInput" type="text" placeholder="새 글감 추가" autocomplete="off">
        <button type="submit">추가</button>
      </form>
      <div class="sheet-actions">
        <button id="exportPdfButton" class="secondary-button" type="button">글 PDF로 내보내기</button>
        <button id="closePromptSheet" class="primary-button" type="button">완료</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
